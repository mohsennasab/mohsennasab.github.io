[web]
# Size of the cells sent to the browser, and the margin kept around the region.
cell_km = 2.0
margin_km = 14
# Rang palette used for the maps. See https://github.com/mohsennasab/Rang
palette = "Nasir"
# Where the dashboard files go, relative to this folder.
data_dir = "../../public/blog/minnesota-rainfall"
json_path = "../../src/data/minnesota-rainfall.json"
# Top of the color scale, in inches. Larger values share the last color.
total_scale_max_in = 10
hourly_scale_max_in = 1.5
total_scale_ticks = [0.25, 1, 2, 3, 4, 6, 8, 10]
hourly_scale_ticks = [0.05, 0.25, 0.5, 1, 1.5]

# Snow water equivalent, from the University of Arizona daily 800 m grids.
# The snow_*.py scripts read this section. A winter is named for the year in
# which it ends: winter 2019 runs from the fall of 2018 to the spring of 2019.
[snow]
# Folder that holds the national daily files, UA_SWE_Depth_800m_v1_YYYYMMDD_stable.nc
# https://climate.arizona.edu/data/UA_SWE/DailyData_800m/
source_dir = "G:/Python Package/uasnow/data/raw/All_NC_Files"
cache_dir = "G:/Python Package/ExtremeRainfall/swe_cache/minnesota"
work_dir = "G:/Python Package/ExtremeRainfall/work/minnesota_snow"
first_winter = 2000
last_winter = 2025
# The count of peak days by month uses a longer record. The data starts in
# October 1981, so winter 1982 is the first one. Remove the line to use the
# same winters as above.
season_first_winter = 1982
# Days of each winter that are read, as month-day. The first belongs to the
# calendar year before the winter's name.
season_start = "10-01"
season_end = "06-30"
# How many of the largest winters get a daily animation.
top_n = 5
# Depths of water, in inches, used to report how much of the region held at least that much.
thresholds_in = [1, 2, 4, 6]
# A cell counts as snow covered when it holds at least this much water, in inches.
cover_threshold_in = 0.1
# The animation of a winter starts and ends where the regional average
# crosses this depth, in inches, with a few days of margin on both sides.
animation_floor_in = 0.05
animation_margin_days = 5
# Web output.
data_dir = "../../public/blog/minnesota-snow"
json_path = "../../src/data/minnesota-snow.json"
# Rang palette for the snow maps, and whether to run it backwards. Iwan goes
# from gold to deep blue, so bare ground is gold and the deepest snow is navy.
palette = "Iwan"
palette_reversed = false
scale_max_in = 8
scale_ticks = [1, 2, 3, 4, 5, 6, 7, 8]
# Colors follow the depth itself here. The rainfall maps use its square root,
# which gives more of the color range to small amounts.
scale_linear = true

# Days on which the AORC total over the state is far from both PRISM and the
# hourly Stage IV analysis, which agree with each other (found by
# 04_screen_daily_totals.py). 02_repair_cache.py replaces their hours with
# Stage IV. Each day is the 24 hours that end at the time given, in UTC.
[[replace_days]]
day_ending_utc = "2022-05-30T12:00"
note = "Statewide: AORC 1.39 in, PRISM 0.54 in, Stage IV 0.49 in"
[[replace_days]]
day_ending_utc = "2009-10-02T12:00"
note = "Statewide: AORC 0.27 in, PRISM 0.89 in, Stage IV 0.97 in"

