# Region settings for the extreme rainfall workflow.
# Copy this file, change the values, and pass it with --config to run another state.

[region]
name = "Minnesota"
slug = "minnesota"
# Polygon of the region in any CRS geopandas can read. See 00_get_boundary.py.
boundary = "boundaries/minnesota.geojson"
# Extra margin around the boundary, in degrees, kept in the cache so storms
# can be seen arriving from outside the region.
buffer_deg = 0.5
# Local time zone used for dates and clock times shown to readers.
timezone = "America/Chicago"
# Projected CRS used for maps and for areas (UTM zone 15N covers Minnesota).
projected_crs = "EPSG:26915"

# Two-letter postal code, used to ask the ACIS service for the PRISM statewide
# average in the screening step. Leave it out for a region that is not a state.
state_postal = "MN"

[period]
# Years that are ranked and mapped. The last complete year of AORC v1.1 at the
# time of writing is 2025. Events outside this range are described in the post
# from other sources.
start_year = 2000
end_year = 2025
# The count of annual events by month uses a longer record. AORC v1.1 starts
# on 1979-02-01, so 1980 is its first complete year. Remove the line to use
# the same years as above.
season_start_year = 1980

[paths]
# The hourly cache is about 0.3 GB per year for Minnesota. Keep it off any
# synced folder.
cache_dir = "G:/Python Package/ExtremeRainfall/aorc_cache/minnesota"
work_dir = "G:/Python Package/ExtremeRainfall/work/minnesota"

[analysis]
# Length of the rolling window, in hours.
duration_hours = 72
# How many of the largest annual events get an hourly animation.
top_n = 5
# Rain depths, in inches, used to report how much of the region got at least that much.
thresholds_in = [1, 2, 3, 4, 6]
# AORC counts rain and melted snow together. With this set, each event also
# reports the share of its water that fell while the air was at or below this
# temperature, in degrees Fahrenheit. Remove the line to skip the check.
cold_threshold_f = 34
# Two-digit state FIPS code, used to pull county outlines from the Census.
state_fips = "27"

